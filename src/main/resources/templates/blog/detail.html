<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title th:text="${post.title + ' - HVTC BAKERY'}">Chi Tiết Bài Viết</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container" style="max-width: 850px;">
        <article class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
            <span class="text-primary fw-bold small text-uppercase font-serif mb-2 d-block"><i class="far fa-folder me-1"></i> Tin Tức & Mẹo Hay</span>
            <h1 class="fw-bold font-serif fs-2 mb-3" th:text="${post.title}">Tiêu Đề Bài Viết</h1>

            <div class="d-flex align-items-center gap-3 text-muted small border-bottom pb-3 mb-4">
                <span><i class="fas fa-user-edit me-1"></i> <strong th:text="${post.author}">Tác giả</strong></span>
                <span>•</span>
                <span><i class="far fa-calendar-alt me-1"></i> <span th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</span></span>
            </div>

            <img th:src="${post.image}" th:alt="${post.title}" class="img-fluid rounded-4 w-100 mb-4" style="max-height: 420px; object-fit: cover;">

            <div class="p-3 bg-light rounded-3 mb-4 fst-italic text-muted border-start border-primary border-4" th:text="${post.summary}">
                Tóm tắt...
            </div>

            <div class="lh-lg text-dark fs-6" th:utext="${#strings.replace(post.content, '&#10;', '&lt;br/&gt;')}">
                Nội dung chi tiết bài viết...
            </div>

            <hr class="my-5">
            <a th:href="@{/blog}" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="fas fa-arrow-left me-1"></i> Quay lại danh sách bài viết</a>
        </article>
    </div>
</div>
</body>
</html>
