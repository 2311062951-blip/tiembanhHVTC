<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>500 Internal Error - Lỗi Hệ Thống</title>
</head>
<body>
<div layout:fragment="content" class="py-5 text-center">
    <div class="container" style="max-width: 600px;">
        <div class="bg-white p-5 rounded-4 border shadow-sm">
            <i class="fas fa-exclamation-triangle fa-5x text-danger mb-4"></i>
            <h2 class="fw-bold font-serif mb-2">500 - LỖI HỆ THỐNG</h2>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Đã xảy ra lỗi không mong muốn. Đội ngũ kỹ thuật HVTC đang khắc phục.'}">Đã xảy ra lỗi.</p>
            <a th:href="@{/}" class="btn-hvtc-primary"><i class="fas fa-home me-1"></i> VỀ TRANG CHỦ</a>
        </div>
    </div>
</div>
</body>
</html>
