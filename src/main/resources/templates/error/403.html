<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>403 Forbidden - Khống Có Quyền Truy Cập</title>
</head>
<body>
<div layout:fragment="content" class="py-5 text-center">
    <div class="container" style="max-width: 600px;">
        <div class="bg-white p-5 rounded-4 border shadow-sm">
            <i class="fas fa-user-lock fa-5x text-danger mb-4"></i>
            <h2 class="fw-bold font-serif mb-2">403 - TỪ CHỐI TRUY CẬP</h2>
            <p class="text-muted mb-4">
                Bạn không có quyền hạn để truy cập vào khu vực quản trị <strong>/admin</strong> hoặc trang này.<br>
                Chỉ có tài khoản với quyền <strong>ROLE_ADMIN</strong> mới được phép truy cập.
            </p>
            <a th:href="@{/}" class="btn-hvtc-primary"><i class="fas fa-home me-1"></i> VỀ TRANG CHỦ</a>
        </div>
    </div>
</div>
</body>
</html>
