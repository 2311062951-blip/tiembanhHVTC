<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Danh Sách Sản Phẩm Bánh Tươi - HVTC BAKERY</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản phẩm</li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Filter Sidebar -->
            <div class="col-lg-3">
                <div class="bg-white p-4 rounded-4 border shadow-sm">
                    <h5 class="fw-bold mb-3 border-bottom pb-2 font-serif text-primary"><i class="fas fa-filter me-2"></i> Lọc Bánh</h5>
                    
                    <form th:action="@{/products}" method="get">
                        <input type="hidden" name="keyword" th:value="${keyword}">
                        
                        <!-- Categories -->
                        <div class="mb-4">
                            <label class="fw-bold small text-muted mb-2">DANH MỤC SẢN PHẨM</label>
                            <div class="list-group list-group-flush">
                                <a th:href="@{/products}" class="list-group-item list-group-item-action border-0 px-0 py-1 small" th:classappend="${selectedCategory == null} ? 'fw-bold text-primary' : ''">Tất cả sản phẩm</a>
                                <a th:each="cat : ${categories}" th:href="@{'/products?category=' + ${cat.slug}}" class="list-group-item list-group-item-action border-0 px-0 py-1 small" th:classappend="${selectedCategory == cat.slug} ? 'fw-bold text-primary' : ''" th:text="${cat.name}">Category</a>
                            </div>
                        </div>

                        <!-- Price Filter -->
                        <div class="mb-4">
                            <label class="fw-bold small text-muted mb-2">KHOẢNG GIÁ (VNĐ)</label>
                            <div class="d-flex gap-2 align-items-center mb-2">
                                <input type="number" name="minPrice" th:value="${minPrice}" class="form-control form-control-sm" placeholder="Từ">
                                <span>-</span>
                                <input type="number" name="maxPrice" th:value="${maxPrice}" class="form-control form-control-sm" placeholder="Đến">
                            </div>
                        </div>

                        <!-- Sort -->
                        <div class="mb-4">
                            <label class="fw-bold small text-muted mb-2">SẮP XẾP</label>
                            <select name="sort" class="form-select form-select-sm">
                                <option value="default" th:selected="${sortBy == 'default'}">Mặc định</option>
                                <option value="newest" th:selected="${sortBy == 'newest'}">Mới nhất</option>
                                <option value="price-asc" th:selected="${sortBy == 'price-asc'}">Giá: Thấp → Cao</option>
                                <option value="price-desc" th:selected="${sortBy == 'price-desc'}">Giá: Cao → Thấp</option>
                                <option value="best-seller" th:selected="${sortBy == 'best-seller'}">Bán chạy nhất</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-hvtc-primary w-100 btn-sm"><i class="fas fa-check me-1"></i> Áp Dụng Lọc</button>
                    </form>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold font-serif m-0" th:text="${keyword != null ? 'Kết quả tìm kiếm cho: &quot;' + keyword + '&quot;' : 'Tất Cả Sản Phẩm'}">Sản Phẩm</h4>
                    <span class="small text-muted" th:text="${productPage != null ? 'Hiển thị ' + productPage.numberOfElements + ' / ' + productPage.totalElements + ' bánh' : ''}"></span>
                </div>

                <!-- Empty State -->
                <div th:if="${products == null or #lists.isEmpty(products)}" class="text-center py-5 bg-white rounded-4 border">
                    <i class="fas fa-cookie fa-4x text-muted mb-3 opacity-50"></i>
                    <h5 class="fw-bold">Rất tiếc! Không tìm thấy sản phẩm bánh phù hợp</h5>
                    <p class="text-muted small">Bạn hãy thử tìm từ khóa khác hoặc bỏ các bộ lọc xem sao nhé.</p>
                    <a th:href="@{/products}" class="btn btn-outline-primary btn-sm rounded-pill">Xem tất cả bánh tươi</a>
                </div>

                <!-- Product Grid -->
                <div class="row g-4" th:if="${products != null and not #lists.isEmpty(products)}">
                    <div class="col-6 col-md-4" th:each="product : ${products}">
                        <div class="hvtc-product-card">
                            <div class="hvtc-product-badges">
                                <span th:if="${product.featured}" class="hvtc-badge-tag hvtc-badge-new">Mới</span>
                                <span th:if="${product.bestSeller}" class="hvtc-badge-tag hvtc-badge-hot">Bán Chạy</span>
                            </div>
                            <a th:href="@{'/product/' + ${product.slug}}" class="hvtc-product-img-wrap">
                                <img th:src="${product.image != null ? product.image : 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600'}" th:alt="${product.name}" class="hvtc-product-img">
                            </a>
                            <div class="hvtc-product-body">
                                <div class="hvtc-product-category" th:text="${product.category != null ? product.category.name : 'HVTC Bakery'}">Bánh Ngọt</div>
                                <a th:href="@{'/product/' + ${product.slug}}" class="hvtc-product-title" th:text="${product.name}">Tên Bánh</a>
                                <div class="hvtc-product-price">
                                    <span class="price-current" th:text="${product.getEffectivePrice() != null ? #numbers.formatDecimal(product.getEffectivePrice(), 0, 'COMMA', 0, 'POINT') + 'đ' : ''}">250.000đ</span>
                                    <span th:if="${product.isOnSale() and product.price != null}" class="price-old" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">280.000đ</span>
                                </div>
                                <div class="d-flex gap-2">
                                    <a th:href="@{'/product/' + ${product.slug}}" class="btn btn-outline-secondary btn-sm rounded-pill flex-grow-1">Chi tiết</a>
                                    <form th:action="@{/cart/add}" method="post" class="m-0">
                                        <input type="hidden" name="productId" th:value="${product.id}">
                                        <input type="hidden" name="quantity" value="1">
                                        <button type="submit" class="btn btn-primary btn-sm rounded-circle px-3"><i class="fas fa-cart-plus"></i></button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${productPage != null and productPage.totalPages > 1}" class="d-flex justify-content-center mt-5">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{/products(page=${productPage.number - 1}, category=${selectedCategory}, keyword=${keyword}, sort=${sortBy}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Trước</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}" th:classappend="${i == productPage.number} ? 'active'">
                                <a class="page-link" th:href="@{/products(page=${i}, category=${selectedCategory}, keyword=${keyword}, sort=${sortBy}, minPrice=${minPrice}, maxPrice=${maxPrice})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/products(page=${productPage.number + 1}, category=${selectedCategory}, keyword=${keyword}, sort=${sortBy}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
