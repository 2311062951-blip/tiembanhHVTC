<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Hồ Sơ Cá Nhân - HVTC BAKERY</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row g-4">
            <!-- Sidebar -->
            <div class="col-lg-3">
                <div class="bg-white p-4 rounded-4 border shadow-sm">
                    <div class="text-center mb-4 pb-3 border-bottom">
                        <div class="hvtc-icon-btn mx-auto mb-2" style="width:60px; height:60px; font-size:1.5rem; background: var(--hvtc-accent-light); color: var(--hvtc-primary);">
                            <i class="fas fa-user"></i>
                        </div>
                        <h6 class="fw-bold m-0" th:text="${user.fullName}">Tên khách hàng</h6>
                        <span class="small text-muted" th:text="${user.email}">Email</span>
                    </div>

                    <div class="list-group list-group-flush">
                        <a th:href="@{/account/profile}" class="list-group-item list-group-item-action border-0 px-3 py-2 rounded-3 mb-1" th:classappend="${activeTab == 'profile'} ? 'bg-primary text-white fw-bold' : ''"><i class="fas fa-id-card me-2"></i> Thông tin cá nhân</a>
                        <a th:href="@{/account/orders}" class="list-group-item list-group-item-action border-0 px-3 py-2 rounded-3 mb-1" th:classappend="${activeTab == 'orders'} ? 'bg-primary text-white fw-bold' : ''"><i class="fas fa-box me-2"></i> Lịch sử đơn hàng</a>
                        <a th:href="@{/account/favorites}" class="list-group-item list-group-item-action border-0 px-3 py-2 rounded-3 mb-1" th:classappend="${activeTab == 'favorites'} ? 'bg-primary text-white fw-bold' : ''"><i class="fas fa-heart me-2"></i> Bánh yêu thích</a>
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-lg-9">
                <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
                    <h4 class="fw-bold font-serif mb-4 border-bottom pb-3 text-primary">Cập Nhật Thông Tin Cá Nhân</h4>

                    <form th:action="@{/account/profile/update}" th:object="${userUpdateDto}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Tên đăng nhập (Cố định)</label>
                                <input type="text" th:value="${user.username}" class="form-control bg-light" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Họ và Tên *</label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Địa chỉ Email *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Địa chỉ nhận bánh mặc định</label>
                            <input type="text" th:field="*{address}" class="form-control">
                        </div>

                        <h5 class="fw-bold font-serif text-primary border-bottom pb-2 mt-5 mb-3">Đổi Mật Khẩu (Để trống nếu không đổi)</h5>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Mật khẩu hiện tại</label>
                                <input type="password" th:field="*{oldPassword}" class="form-control" placeholder="Mật khẩu hiện tại...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Mật khẩu mới</label>
                                <input type="password" th:field="*{newPassword}" class="form-control" placeholder="Mật khẩu mới...">
                            </div>
                        </div>

                        <button type="submit" class="btn-hvtc-primary px-4"><i class="fas fa-save me-1"></i> LƯU THAY ĐỔI</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
