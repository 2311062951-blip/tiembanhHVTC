<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Đăng Nhập Tài Khoản - HVTC BAKERY</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container" style="max-width: 480px;">
        <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
            <div class="text-center mb-4">
                <h3 class="fw-bold font-serif text-primary m-0">ĐĂNG NHẬP</h3>
                <p class="text-muted small">Chào mừng bạn trở lại với HVTC BAKERY</p>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tên đăng nhập hoặc Email</label>
                    <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập hoặc email..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" placeholder="Mật khẩu của bạn..." required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check m-0">
                        <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                        <label class="form-check-label" for="remember-me">Ghi nhớ đăng nhập</label>
                    </div>
                    <a href="#" class="text-primary text-decoration-none">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-hvtc-primary w-100 justify-content-center py-2 fs-6 mb-3">
                    <i class="fas fa-sign-in-alt me-1"></i> ĐĂNG NHẬP
                </button>
            </form>

            <div class="text-center small text-muted pt-3 border-top">
                Chưa có tài khoản HVTC Bakery? <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Đăng ký ngay</a>
            </div>

            <!-- Sample Credentials Hint for Testing -->
            <div class="mt-4 p-3 bg-light rounded-3 border small">
                <div class="fw-bold text-dark mb-1"><i class="fas fa-info-circle text-primary me-1"></i> Tài khoản mẫu thử nghiệm:</div>
                <div class="text-muted">• <strong>Admin:</strong> admin / Admin@123</div>
                <div class="text-muted">• <strong>User:</strong> user / User@123</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
