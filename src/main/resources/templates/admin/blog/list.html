<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>HVTC Bakery Admin - Quản Lý Bài Viết Blog</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0">Quản Lý Bài Viết Blog</h3>
        <a th:href="@{/admin/blog/create}" class="btn btn-primary rounded-pill"><i class="fas fa-plus me-1"></i> Thêm Bài Viết Mới</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Ảnh</th>
                        <th>Tiêu Đề</th>
                        <th>Tác Giả</th>
                        <th>Ngày Tạo</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post : ${posts}">
                        <td>
                            <img th:src="${post.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td class="fw-bold" th:text="${post.title}">Title</td>
                        <td th:text="${post.author}">Author</td>
                        <td class="small text-muted" th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy')}">Date</td>
                        <td>
                            <span class="badge" th:classappend="${post.status} ? 'bg-success' : 'bg-secondary'" th:text="${post.status ? 'Xuất bản' : 'Ẩn'}">Status</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/admin/blog/edit/' + ${post.id}}" class="btn btn-sm btn-outline-primary rounded-circle me-1"><i class="fas fa-edit"></i></a>
                            <form th:action="@{'/admin/blog/delete/' + ${post.id}}" method="post" class="d-inline" onsubmit="return confirm('Xóa bài viết này?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
