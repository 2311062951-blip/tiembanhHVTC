<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>Form Bài Viết Blog - HVTC Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0" th:text="${isEdit ? 'Sửa Bài Viết' : 'Thêm Bài Viết Mới'}">Form Bài Viết</h3>
        <a th:href="@{/admin/blog}" class="btn btn-outline-secondary rounded-pill"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
        <form th:action="${isEdit} ? @{'/admin/blog/edit/' + ${post.id}} : @{/admin/blog/create}" th:object="${post}" method="post" enctype="multipart/form-data">
            
            <div class="mb-3">
                <label class="form-label small fw-bold">Tiêu Đề Bài Viết *</label>
                <input type="text" th:field="*{title}" class="form-control" required placeholder="Nhập tiêu đề...">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Tác Giả</label>
                    <input type="text" th:field="*{author}" class="form-control" placeholder="HVTC Bakery Team">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Hình Ảnh Bài Viết</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Tóm Tắt Ngắn</label>
                <textarea th:field="*{summary}" class="form-control" rows="2" placeholder="Nội dung tóm tắt..."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Nội Dung Chi Tiết *</label>
                <textarea th:field="*{content}" class="form-control" rows="8" required placeholder="Viết nội dung bài viết ở đây..."></textarea>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusSwitch">
                <label class="form-check-label fw-bold small" for="statusSwitch">Xuất bản bài viết</label>
            </div>

            <button type="submit" class="btn btn-primary px-5 rounded-pill"><i class="fas fa-save me-1"></i> LƯU BÀI VIẾT</button>
        </form>
    </div>
</div>
</body>
</html>
