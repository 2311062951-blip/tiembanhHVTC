<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>HVTC Bakery Admin - Quản Lý Sản Phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0">Quản Lý Sản Phẩm Bánh</h3>
        <a th:href="@{/admin/products/create}" class="btn btn-primary rounded-pill"><i class="fas fa-plus me-1"></i> Thêm Bánh Mới</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Ảnh</th>
                        <th>Mã</th>
                        <th>Tên Bánh</th>
                        <th>Danh Mục</th>
                        <th>Giá Bán</th>
                        <th>Tồn Kho</th>
                        <th>Nổi Bật</th>
                        <th>Bán Chạy</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td>
                            <img th:src="${p.image != null ? p.image : 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=100'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td class="font-monospace text-muted small" th:text="${p.productCode}">CODE</td>
                        <td class="fw-bold" th:text="${p.name}">Tên bánh</td>
                        <td th:text="${p.category.name}">Danh mục</td>
                        <td>
                            <div class="fw-bold text-primary" th:text="${#numbers.formatDecimal(p.getEffectivePrice(), 0, 'COMMA', 0, 'POINT')} + 'đ'">250.000đ</div>
                            <small th:if="${p.isOnSale()}" class="text-muted text-decoration-line-through" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">280.000đ</small>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${p.stockQuantity > 5 ? 'bg-success' : 'bg-danger'}" th:text="${p.stockQuantity}">10</span>
                        </td>
                        <td>
                            <form th:action="@{'/admin/products/toggle-featured/' + ${p.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-link p-0 text-decoration-none">
                                    <i class="fas fa-star fs-5" th:classappend="${p.featured} ? 'text-warning' : 'text-muted opacity-25'"></i>
                                </button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{'/admin/products/toggle-bestseller/' + ${p.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-link p-0 text-decoration-none">
                                    <i class="fas fa-fire fs-5" th:classappend="${p.bestSeller} ? 'text-danger' : 'text-muted opacity-25'"></i>
                                </button>
                            </form>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${p.status} ? 'bg-success' : 'bg-secondary'" th:text="${p.status ? 'Đang bán' : 'Ẩn'}">Status</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/admin/products/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary rounded-circle me-1" title="Sửa"><i class="fas fa-edit"></i></a>
                            <form th:action="@{'/admin/products/delete/' + ${p.id}}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa chiếc bánh này không?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle" title="Xóa"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
