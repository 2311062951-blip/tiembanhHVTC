<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>HVTC Bakery Admin - Quản Lý Workshop</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0">Quản Lý Workshop Làm Bánh</h3>
        <a th:href="@{/admin/workshops/create}" class="btn btn-primary rounded-pill"><i class="fas fa-plus me-1"></i> Thêm Workshop Mới</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên Workshop</th>
                        <th>Giá Học</th>
                        <th>Thời Lượng</th>
                        <th>Chỗ Đã Đăng Ký</th>
                        <th>Ngày Học</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ws : ${workshops}">
                        <td>
                            <img th:src="${ws.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td class="fw-bold" th:text="${ws.name}">Name</td>
                        <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(ws.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">650.000đ</td>
                        <td th:text="${ws.duration}">3 giờ</td>
                        <td>
                            <span class="badge bg-info text-dark" th:text="${ws.registeredCount + ' / ' + ws.capacity}">0/12</span>
                        </td>
                        <td class="small" th:text="${#temporals.format(ws.workshopDate, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td>
                            <span class="badge" th:classappend="${ws.status} ? 'bg-success' : 'bg-secondary'" th:text="${ws.status ? 'Mở đăng ký' : 'Đóng'}">Status</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/admin/workshops/edit/' + ${ws.id}}" class="btn btn-sm btn-outline-primary rounded-circle me-1"><i class="fas fa-edit"></i></a>
                            <form th:action="@{'/admin/workshops/delete/' + ${ws.id}}" method="post" class="d-inline" onsubmit="return confirm('Xóa workshop này?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
