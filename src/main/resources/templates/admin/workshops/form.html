<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>Form Workshop - HVTC Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0" th:text="${isEdit ? 'Sửa Workshop' : 'Thêm Workshop Mới'}">Form Workshop</h3>
        <a th:href="@{/admin/workshops}" class="btn btn-outline-secondary rounded-pill"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-4">
        <form th:action="${isEdit} ? @{'/admin/workshops/edit/' + ${workshop.id}} : @{/admin/workshops/create}" th:object="${workshop}" method="post" enctype="multipart/form-data">
            
            <div class="mb-3">
                <label class="form-label small fw-bold">Tên Workshop *</label>
                <input type="text" th:field="*{name}" class="form-control" required placeholder="Nhập tên lớp học...">
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Học Phí (VNĐ) *</label>
                    <input type="number" th:field="*{price}" class="form-control" required placeholder="650000">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Thời Lượng</label>
                    <input type="text" th:field="*{duration}" class="form-control" placeholder="3.5 giờ">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Số Lượng Chỗ Tối Đa *</label>
                    <input type="number" th:field="*{capacity}" class="form-control" required placeholder="12">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Địa Điểm Học</label>
                    <input type="text" th:field="*{location}" class="form-control" placeholder="HVTC Kitchen Studio...">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold">Hình Ảnh Workshop</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Mô Tả Chi Tiết Workshop</label>
                <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nội dung trải nghiệm..."></textarea>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusSwitch">
                <label class="form-check-label fw-bold small" for="statusSwitch">Cho phép đăng ký</label>
            </div>

            <button type="submit" class="btn btn-primary px-5 rounded-pill"><i class="fas fa-save me-1"></i> LƯU WORKSHOP</button>
        </form>
    </div>

    <!-- Registered Students List if Edit -->
    <div th:if="${isEdit and registrations != null}" class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-header bg-white py-3">
            <h5 class="fw-bold font-serif m-0">Danh Sách Học Viên Đã Đăng Ký</h5>
        </div>
        <div class="table-responsive">
            <table class="table align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Họ Và Tên</th>
                        <th>SĐT</th>
                        <th>Email</th>
                        <th>Ghi Chú</th>
                        <th>Ngày Đăng Ký</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${registrations}">
                        <td class="fw-bold" th:text="${r.customerName}">Name</td>
                        <td th:text="${r.phone}">Phone</td>
                        <td th:text="${r.email}">Email</td>
                        <td class="small text-muted" th:text="${r.note}">Note</td>
                        <td class="small text-muted" th:text="${#temporals.format(r.registeredAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
