<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>Form Danh Mục - HVTC Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0" th:text="${isEdit ? 'Sửa Danh Mục' : 'Thêm Danh Mục Mới'}">Form Danh Mục</h3>
        <a th:href="@{/admin/categories}" class="btn btn-outline-secondary rounded-pill"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="max-width: 650px;">
        <form th:action="${isEdit} ? @{'/admin/categories/edit/' + ${categoryDto.id}} : @{/admin/categories/create}" th:object="${categoryDto}" method="post" enctype="multipart/form-data">
            
            <div class="mb-3">
                <label class="form-label small fw-bold">Tên Danh Mục *</label>
                <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Ví dụ: Bánh Mỳ Ngàn Lớp" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Lỗi tên</div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Slug (Tùy chọn)</label>
                <input type="text" th:field="*{slug}" class="form-control" placeholder="banh-my-ngan-lop">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Hình Ảnh Đại Diện</label>
                <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Mô Tả Danh Mục</label>
                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả tóm tắt..."></textarea>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" th:field="*{status}" id="statusSwitch">
                <label class="form-check-label fw-bold small" for="statusSwitch">Kích hoạt danh mục</label>
            </div>

            <button type="submit" class="btn btn-primary px-5 rounded-pill"><i class="fas fa-save me-1"></i> LƯU DANH MỤC</button>
        </form>
    </div>
</div>
</body>
</html>
