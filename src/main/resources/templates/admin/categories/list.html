<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>HVTC Bakery Admin - Quản Lý Danh Mục</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0">Quản Lý Danh Mục Bánh</h3>
        <a th:href="@{/admin/categories/create}" class="btn btn-primary rounded-pill"><i class="fas fa-plus me-1"></i> Thêm Danh Mục Mới</a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên Danh Mục</th>
                        <th>Slug</th>
                        <th>Mô Tả</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${categories}">
                        <td>
                            <img th:src="${c.image != null ? c.image : 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=100'}" style="width: 48px; height: 48px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td class="fw-bold" th:text="${c.name}">Name</td>
                        <td class="font-monospace small text-muted" th:text="${c.slug}">slug</td>
                        <td class="small text-muted" th:text="${c.description}">Description</td>
                        <td>
                            <span class="badge" th:classappend="${c.status} ? 'bg-success' : 'bg-secondary'" th:text="${c.status ? 'Hoạt động' : 'Ẩn'}">Status</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/admin/categories/edit/' + ${c.id}}" class="btn btn-sm btn-outline-primary rounded-circle me-1"><i class="fas fa-edit"></i></a>
                            <form th:action="@{'/admin/categories/delete/' + ${c.id}}" method="post" class="d-inline" onsubmit="return confirm('Xóa danh mục này?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
