<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>HVTC Bakery Admin - Quản Lý Đơn Hàng</title>
</head>
<body>
<div layout:fragment="content">
    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-4" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-4" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0">Quản Lý Đơn Hàng</h3>
        
        <div class="d-flex align-items-center gap-3">
            <!-- Filter Status Dropdown -->
            <form th:action="@{/admin/orders}" method="get" class="d-flex align-items-center gap-2">
                <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                    <option value="">-- Tất cả trạng thái --</option>
                    <option th:each="s : ${allStatuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${selectedStatus == s}">Status</option>
                </select>
            </form>

            <!-- Delete All Orders Button -->
            <form th:action="@{/admin/orders/delete-all}" method="post" onsubmit="return confirm('Bạn có chắc chắn muốn xóa TOÀN BỘ lịch sử đơn hàng? Hành động này không thể hoàn tác!')">
                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill fw-bold">
                    <i class="fas fa-trash-alt me-1"></i> Xóa toàn bộ lịch sử
                </button>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Mã Đơn</th>
                        <th>Khách Hàng</th>
                        <th>SĐT</th>
                        <th>Ngày Đặt</th>
                        <th>Tổng Tiền</th>
                        <th>Thanh Toán</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td class="fw-bold font-monospace text-primary" th:text="${o.orderCode}">Code</td>
                        <td th:text="${o.customerName}">Name</td>
                        <td th:text="${o.phone}">Phone</td>
                        <td class="small" th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td class="fw-bold" th:text="${#numbers.formatDecimal(o.getGrandTotal(), 0, 'COMMA', 0, 'POINT')} + 'đ'">Total</td>
                        <td>
                            <span class="badge" th:classappend="${o.paymentStatus.name() == 'PAID' ? 'bg-success' : 'bg-secondary'}" th:text="${o.paymentStatus.displayName}">UNPAID</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${o.orderStatus.name() == 'COMPLETED' ? 'bg-success' : (o.orderStatus.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark')}" th:text="${o.orderStatus.displayName}">PENDING</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/admin/orders/' + ${o.id}}" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fas fa-eye me-1"></i> Xử lý</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
