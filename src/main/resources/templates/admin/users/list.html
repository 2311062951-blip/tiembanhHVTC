<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin_base}">
<head>
    <title>HVTC Bakery Admin - Quản Lý Người Dùng</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold font-serif m-0">Quản Lý Tài Khoản Người Dùng</h3>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-light">
                    <tr>
                        <th>Username</th>
                        <th>Họ Và Tên</th>
                        <th>Email</th>
                        <th>Số Điện Thoại</th>
                        <th>Quyền (Role)</th>
                        <th>Trạng Thái</th>
                        <th class="text-end">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="fw-bold font-monospace text-primary" th:text="${u.username}">Username</td>
                        <td th:text="${u.fullName}">FullName</td>
                        <td th:text="${u.email}">Email</td>
                        <td th:text="${u.phone != null ? u.phone : '-'}">Phone</td>
                        <td>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/change-role'}" method="post" class="d-inline">
                                <select name="role" class="form-select form-select-sm" onchange="this.form.submit()">
                                    <option value="ROLE_USER" th:selected="${#sets.contains(u.roles, 'ROLE_USER') && !#sets.contains(u.roles, 'ROLE_ADMIN')}">ROLE_USER</option>
                                    <option value="ROLE_ADMIN" th:selected="${#sets.contains(u.roles, 'ROLE_ADMIN')}">ROLE_ADMIN</option>
                                </select>
                            </form>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-danger'" th:text="${u.enabled ? 'Hoạt động' : 'Khóa'}">Status</span>
                        </td>
                        <td class="text-end">
                            <!-- Toggle Status Lock/Unlock -->
                            <form th:action="@{'/admin/users/' + ${u.id} + '/toggle-status'}" method="post" class="d-inline me-1">
                                <button type="submit" class="btn btn-sm rounded-circle" th:classappend="${u.enabled} ? 'btn-outline-warning' : 'btn-outline-success'" th:title="${u.enabled ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                                    <i class="fas" th:classappend="${u.enabled} ? 'fa-lock' : 'fa-unlock'"></i>
                                </button>
                            </form>

                            <!-- Delete -->
                            <form th:action="@{'/admin/users/delete/' + ${u.id}}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle" title="Xóa tài khoản"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
