<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chatbot">
    <!-- Floating Trigger Button -->
    <button class="hvtc-chatbot-trigger" id="chatbotTrigger" title="Tư vấn AI Chatbot">
        <i class="fas fa-robot"></i>
    </button>

    <!-- Chatbot Window -->
    <div class="hvtc-chatbot-box" id="chatbotBox">
        <div class="hvtc-chatbot-header">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-cookie-bite fa-lg"></i>
                <div>
                    <h6 class="m-0 fw-bold">Trợ Lý Bánh Tươi HVTC AI</h6>
                    <span style="font-size: 0.72rem; opacity: 0.85;">Trực tuyến 24/7 • Tư vấn chọn bánh</span>
                </div>
            </div>
            <button class="btn btn-sm text-white" id="chatbotClose"><i class="fas fa-times"></i></button>
        </div>

        <div class="hvtc-chatbot-messages" id="chatMessages">
            <div class="chat-msg bot">
                HVTC BAKERY xin chào! Tôi là Trợ lý AI. Bạn cần tư vấn bánh sinh nhật, bánh ít ngọt hay quà tặng bánh tươi ạ?
            </div>
        </div>

        <div class="hvtc-chatbot-input-wrap">
            <input type="text" id="chatInput" class="form-control form-control-sm" placeholder="Nhập câu hỏi (ví dụ: bánh nào ít ngọt?)...">
            <button class="btn btn-primary btn-sm rounded-circle px-3" id="chatSendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>
</body>
</html>
