<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVTC Bakery Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="admin-brand">
            HVTC BAKERY <span style="font-size: 0.75rem;" class="badge bg-warning text-dark align-top">ADMIN</span>
        </div>
        <ul class="admin-menu">
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'dashboard'} ? 'active' : ''">
                <a th:href="@{/admin}"><i class="fas fa-chart-line"></i> Dashboard</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'products'} ? 'active' : ''">
                <a th:href="@{/admin/products}"><i class="fas fa-cookie-bite"></i> Quản lý Sản Phẩm</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'categories'} ? 'active' : ''">
                <a th:href="@{/admin/categories}"><i class="fas fa-list"></i> Quản lý Danh Mục</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'orders'} ? 'active' : ''">
                <a th:href="@{/admin/orders}"><i class="fas fa-shopping-cart"></i> Quản lý Đơn Hàng</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'users'} ? 'active' : ''">
                <a th:href="@{/admin/users}"><i class="fas fa-users"></i> Quản lý Người Dùng</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'workshops'} ? 'active' : ''">
                <a th:href="@{/admin/workshops}"><i class="fas fa-graduation-cap"></i> Quản lý Workshop</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'blog'} ? 'active' : ''">
                <a th:href="@{/admin/blog}"><i class="fas fa-newspaper"></i> Quản lý Bài Viết</a>
            </li>
            <li class="admin-menu-item" th:classappend="${activeAdminMenu == 'reviews'} ? 'active' : ''">
                <a th:href="@{/admin/reviews}"><i class="fas fa-star"></i> Quản lý Đánh Giá</a>
            </li>
            <li class="admin-menu-item mt-4">
                <a th:href="@{/}" target="_blank" class="text-info"><i class="fas fa-external-link-alt"></i> Xem Website</a>
            </li>
            <li class="admin-menu-item">
                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                    <button type="submit" class="btn btn-link text-danger text-decoration-none w-100 text-start px-4 py-2">
                        <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                    </button>
                </form>
            </li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-content">
        <!-- Flash Alerts -->
        <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div layout:fragment="content">
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
