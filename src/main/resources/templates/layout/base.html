<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - HVTC BAKERY' : 'HVTC BAKERY - Website Bán Bánh Online Cao Cấp'}">HVTC BAKERY</title>
    <meta name="description" th:content="${metaDescription != null ? metaDescription : 'HVTC BAKERY - Thương hiệu bánh tươi cao cấp, bánh mì ngàn lớp, bánh ngọt Mousse, Cheesecake và bánh sinh nhật thiết kế sang trọng.'}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Custom HVTC Bakery CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Flash Notification Alerts -->
    <div class="container mt-3" th:if="${successMessage != null or errorMessage != null}">
        <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show rounded-4 shadow-sm" role="alert">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show rounded-4 shadow-sm" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Main Dynamic Content -->
    <main class="flex-grow-1" layout:fragment="content">
    </main>

    <!-- AI Chatbot Fragment -->
    <div th:replace="~{fragments/chatbot :: chatbot}"></div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/chatbot.js}"></script>
</body>
</html>
