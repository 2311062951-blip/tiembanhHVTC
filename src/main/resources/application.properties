# Application Configuration
spring.application.name=HVTC Bakery
server.port=8080

# Database Configuration (H2 File-based Persistent Database - Saved to ./data)
spring.datasource.url=jdbc:h2:file:./data/hvtc_bakery;AUTO_SERVER=TRUE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true

# Initial Data Seeding
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Application Properties
hvtc.bakery.upload-dir=${user.home}/hvtc-bakery-uploads
hvtc.ai.chatbot.api-key=${CHATBOT_API_KEY:demo-hvtc-bakery-key}
hvtc.ai.chatbot.model=gpt-3.5-turbo

